<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - EPC Commercial Corporation</title>
  <link rel="stylesheet" href="../assets/style.css?v=20261117-quota">
</head>
<body>
<div id="sidebar-container"></div>
<div class="main-content">
  <header class="page-header">
    <div class="page-header-inner">
      <h1>Settings</h1>
      <p>Manage your user profile and login credentials.</p>
    </div>
  </header>
  <div class="page-body">
    <div class="page-title-row">
      <div class="title-area">
        <span class="section-title">User Profile</span>
        <span class="section-subtitle">Audit logs use this profile name.</span>
      </div>
    </div>

    <div class="card" style="max-width:760px;padding:22px">
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input class="form-input" id="set-last-name">
        </div>
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input class="form-input" id="set-first-name">
        </div>
      </div>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Middle Name</label>
          <input class="form-input" id="set-middle-name">
        </div>
        <div class="form-group">
          <label class="form-label">Role</label>
          <input class="form-input" id="set-role" readonly>
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
        <button class="btn btn-primary" id="btn-save-profile" type="button">Save Profile</button>
        <span id="settings-status" style="font-size:0.875rem;color:var(--text-secondary)"></span>
      </div>
    </div>

    <div class="card" style="max-width:760px;padding:22px;margin-top:18px">
      <h3 style="margin:0 0 6px">Change Password</h3>
      <p style="margin:0 0 16px;color:var(--text-secondary);font-size:0.875rem">Update the password for your selected access role.</p>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <input class="form-input" id="set-current-password" type="password" autocomplete="current-password">
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input class="form-input" id="set-password" type="password" autocomplete="new-password">
        </div>
      </div>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input class="form-input" id="set-password-confirm" type="password" autocomplete="new-password">
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
        <button class="btn btn-primary" id="btn-change-password" type="button">Change Password</button>
        <span id="password-status" style="font-size:0.875rem;color:var(--text-secondary)"></span>
      </div>
    </div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script src="../assets/app.js?v=20261118-reads"></script>
<script src="settings.js"></script>
</body>
</html>
