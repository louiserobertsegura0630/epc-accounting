<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses - EPC Commercial Corporation</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="expenses.css">
</head>
<body>
<div id="sidebar-container"></div>
<div class="main-content">

  <header class="page-header">
    <div class="page-header-inner">
      <h1>Expenses</h1>
      <p>Record operating expenses and classify each transaction for reporting.</p>
    </div>
  </header>

  <div class="page-body">

    <div class="page-title-row">
      <div class="title-area">
        <span class="section-title">Expenses</span>
        <span class="section-subtitle">Record and classify all business and personal expenses.</span>
      </div>
      <div class="page-title-actions">
        <button class="btn btn-outline-gray" id="btn-export-expenses" type="button">Export CSV</button>
        <button class="btn btn-primary" id="btn-add-expense">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Expense
        </button>
      </div>
    </div>

    <!-- Summary -->
    <div class="summary-row" id="exp-summary"></div>

    <!-- Category pills -->
    <div id="cat-pills-row" class="cat-pills mb-16"></div>

    <!-- Table -->
    <div class="table-container">
      <div class="table-toolbar">
        <span class="table-toolbar-title">Expense Records</span>
        <input type="text" class="search-input" id="search-exp" placeholder="Search name, category, description…">
        <select class="form-select" id="filter-class" style="width:auto">
          <option value="">All</option>
          <option value="Business">Business</option>
          <option value="Personal">Personal</option>
        </select>
        <button class="btn btn-outline-gray btn-sm" id="btn-clear-exp-filters" type="button">Clear Filters</button>
      </div>
      <div class="table-scroll">
      <table class="expenses-table">
        <thead id="exp-thead"></thead>
        <tbody id="exp-tbody"></tbody>
      </table>
      </div>
    </div>

  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal-expense">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title" id="modal-exp-title">Add Expense</span>
      <button class="modal-close" data-close-modal>✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="exp-edit-id">

      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Expense Name <span class="req">*</span></label>
          <input type="text" class="form-input" id="f-exp-name" placeholder="e.g. Electricity Bill">
        </div>
        <div class="form-group">
          <label class="form-label">Date <span class="req">*</span></label>
          <input type="date" class="form-input" id="f-exp-date">
        </div>
      </div>

      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Category <span class="req">*</span></label>
          <select class="form-select" id="f-exp-cat"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Gross Amount (₱) <span class="req">*</span></label>
          <input type="text" class="form-input" id="f-exp-amount" data-currency placeholder="0.00">
        </div>
      </div>

      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Net Amount (₱)</label>
          <input type="text" class="form-input" id="f-exp-net-amount" data-currency placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">VAT (₱)</label>
          <input type="text" class="form-input" id="f-exp-vat" data-currency placeholder="0.00">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="f-exp-desc" placeholder="Optional description…"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Classification <span class="req">*</span></label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="exp-class" value="Business" id="r-business" checked>
            Business <span style="font-size:12px;color:#16a34a;margin-left:4px">(affects Income Statement)</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="exp-class" value="Personal" id="r-personal">
            Personal <span style="font-size:12px;color:#94a3b8;margin-left:4px">(included in report total)</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Tax Treatment <span class="req">*</span></label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="exp-deductible" value="Deductible" id="r-deductible" checked>
            Deductible <span style="font-size:12px;color:#16a34a;margin-left:4px">(included in tax computations)</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="exp-deductible" value="Non-deductible" id="r-nondeductible">
            Non-deductible <span style="font-size:12px;color:#94a3b8;margin-left:4px">(excluded from tax computations)</span>
          </label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline-gray" data-close-modal>Cancel</button>
      <button class="btn btn-primary" id="btn-save-expense">Save Expense</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script src="../assets/app.js?v=20260622-no-auto-logout"></script>
<script src="expenses.js"></script>
</body>
</html>
