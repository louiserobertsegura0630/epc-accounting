<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potential Revenue - EPC Commercial Corporation</title>
  <link rel="stylesheet" href="../assets/style.css?v=20260729-outgoing-source">
  <link rel="stylesheet" href="inventory-tracking.css">
</head>
<body>
<div id="sidebar-container"></div>
<div class="main-content">
  <header class="page-header">
    <div class="page-header-inner">
      <h1>Potential Revenue</h1>
      <p>Review sellable inventory, set pricing assumptions, and estimate potential revenue.</p>
    </div>
  </header>

  <div class="page-body">
    <div class="page-title-row">
      <div class="title-area">
        <span class="section-title">Potential Revenue</span>
        <span class="section-subtitle">Computed from incoming inventory less outgoing sales and releases.</span>
      </div>
      <div class="page-title-actions">
        <span id="potential-gen-status" class="gen-status"></span>
        <button class="btn btn-primary" id="potential-generate-btn" type="button">Generate Report</button>
        <button class="btn btn-outline-gray" id="btn-export-potential" type="button">Export as CSV</button>
      </div>
    </div>

    <div class="report-empty-state" id="potential-empty-state">
      Click <strong>Generate Report</strong> to load potential revenue data.
    </div>

    <div class="summary-row" id="potential-summary"></div>

    <div class="table-container">
      <div class="table-toolbar">
        <span class="table-toolbar-title">Potential Revenue Records</span>
        <input type="text" class="search-input" id="search-inv" placeholder="Search item, supplier, category…">
        <button class="btn btn-outline-gray btn-sm" id="btn-clear-inv" onclick="clearPotentialFilters()" style="display:none">Clear Filters</button>
      </div>

      <div class="potential-revenue-panel open" id="potential-revenue-panel">
        <div class="potential-subtabs">
          <button class="potential-subtab active" id="potential-subtab-included" type="button" onclick="setPotentialSubtab('included')">
            Inclusions of Potential Revenue
          </button>
          <button class="potential-subtab" id="potential-subtab-review" type="button" onclick="setPotentialSubtab('review')">
            For Review
          </button>
          <button class="potential-subtab potential-detail-tab" id="potential-subtab-detail" type="button">
            Item Detail
          </button>
        </div>
        <div class="potential-settings">
          <label>
            Average markup for all items
            <div class="markup-control">
              <input type="number" min="0" step="0.01" id="potential-global-markup" placeholder="0">
              <span>%</span>
            </div>
          </label>
          <label>
            Category
            <select id="potential-category-select"></select>
          </label>
          <label>
            Category markup
            <div class="markup-control">
              <input type="number" min="0" step="0.01" id="potential-category-markup" placeholder="0">
              <span>%</span>
            </div>
          </label>
          <button class="btn btn-primary btn-sm" id="btn-save-potential-markup" type="button">
            Apply Markup
          </button>
        </div>
      </div>

      <div class="potential-bulk-bar" id="potential-bulk-bar">
        <span id="potential-bulk-count">0 items selected</span>
        <label class="potential-bulk-markup" id="potential-bulk-markup-wrap">
          Set selected markup
          <input type="number" min="0" step="0.01" id="potential-bulk-markup" placeholder="0">
          <span>%</span>
        </label>
        <button class="btn btn-primary btn-sm" id="btn-apply-selected-potential-markup" type="button">Apply Markup</button>
        <button class="btn btn-danger btn-sm" id="btn-delete-selected-potential" type="button">Delete Selected</button>
        <button class="bulk-deselect" id="btn-clear-potential-selection" type="button">Clear Selection</button>
      </div>

      <div class="bulk-action-bar" id="inv-bulk-bar"></div>
      <div class="table-scroll">
        <table>
          <thead id="inv-thead"></thead>
          <tbody id="inv-tbody"></tbody>
        </table>
      </div>
      <div class="pagination-bar" id="inv-pagination"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script src="../assets/app.js?v=20260728-supplier-tab"></script>
<script src="../assets/shared-utils.js"></script>
<script src="potential-revenue.js"></script>
</body>
</html>
